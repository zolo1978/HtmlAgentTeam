<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060912"/>
      <stop offset="100%" stop-color="#0b1628"/>
    </linearGradient>

    <linearGradient id="harpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#818cf8"/>
      <stop offset="45%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#e879f9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="bottomBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#818cf8"/>
      <stop offset="50%"  stop-color="#e879f9"/>
      <stop offset="80%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <radialGradient id="centerHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bgGlow" cx="72%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#312e81" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="clip">
      <rect width="1200" height="480"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)"/>
  <rect width="1200" height="480" fill="url(#bgGlow)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#ffffff" opacity="0.04"/>
  </pattern>
  <rect width="1200" height="480" fill="url(#dots)"/>

  <!-- ═══════════════════════════ -->
  <!--  RIGHT: Neural graph       -->
  <!-- ═══════════════════════════ -->

  <!-- Ambient halo behind graph -->
  <circle cx="870" cy="240" r="200" fill="url(#centerHalo)"/>

  <!-- Edge lines -->
  <g fill="none" stroke-width="1.2" opacity="0.5">
    <!-- center → memory -->
    <line x1="870" y1="240" x2="718" y2="138" stroke="url(#lineGrad)" stroke-dasharray="5 4"/>
    <!-- center → growth -->
    <line x1="870" y1="240" x2="1038" y2="148" stroke="url(#lineGrad)" stroke-dasharray="5 4"/>
    <!-- center → reflect -->
    <line x1="870" y1="240" x2="1038" y2="332" stroke="url(#lineGrad)" stroke-dasharray="5 4"/>
    <!-- center → skill -->
    <line x1="870" y1="240" x2="718" y2="338" stroke="url(#lineGrad)" stroke-dasharray="5 4"/>
    <!-- center → sop -->
    <line x1="870" y1="240" x2="870" y2="96" stroke="url(#lineGrad)" stroke-dasharray="5 4"/>
    <!-- secondary edges -->
    <line x1="718" y1="138" x2="870" y2="96"   stroke="#818cf8" stroke-dasharray="3 6" opacity="0.25"/>
    <line x1="1038" y1="148" x2="870" y2="96"  stroke="#818cf8" stroke-dasharray="3 6" opacity="0.25"/>
    <line x1="1038" y1="332" x2="718" y2="338" stroke="#818cf8" stroke-dasharray="3 6" opacity="0.25"/>
  </g>

  <!-- ── Orbit ring ── -->
  <circle cx="870" cy="240" r="148" fill="none" stroke="#818cf8" stroke-width="0.7"
          stroke-dasharray="2 8" opacity="0.3"/>

  <!-- ── Satellite nodes ── -->

  <!-- Memory (top-left) -->
  <circle cx="718" cy="138" r="36" fill="#0e1a2e" stroke="url(#nodeBlue)" stroke-width="1.8" filter="url(#subtleGlow)"/>
  <text x="718" y="131" font-size="16" text-anchor="middle" font-family="system-ui">🧠</text>
  <text x="718" y="149" font-size="9.5" font-family="'SF Mono',monospace" fill="#7dd3fc" text-anchor="middle" letter-spacing="2">MEMORY</text>

  <!-- Growth (top-right) -->
  <circle cx="1038" cy="148" r="36" fill="#0e1a2e" stroke="url(#nodeGreen)" stroke-width="1.8" filter="url(#subtleGlow)"/>
  <text x="1038" y="141" font-size="16" text-anchor="middle" font-family="system-ui">📈</text>
  <text x="1038" y="159" font-size="9.5" font-family="'SF Mono',monospace" fill="#6ee7b7" text-anchor="middle" letter-spacing="2">GROWTH</text>

  <!-- Reflect (bottom-right) -->
  <circle cx="1038" cy="332" r="36" fill="#0e1a2e" stroke="url(#nodePurple)" stroke-width="1.8" filter="url(#subtleGlow)"/>
  <text x="1038" y="325" font-size="16" text-anchor="middle" font-family="system-ui">🔁</text>
  <text x="1038" y="343" font-size="9.5" font-family="'SF Mono',monospace" fill="#d8b4fe" text-anchor="middle" letter-spacing="2">REFLECT</text>

  <!-- Skill (bottom-left) -->
  <circle cx="718" cy="338" r="36" fill="#0e1a2e" stroke="url(#nodeBlue)" stroke-width="1.8" filter="url(#subtleGlow)"/>
  <text x="718" y="331" font-size="16" text-anchor="middle" font-family="system-ui">🔧</text>
  <text x="718" y="349" font-size="9.5" font-family="'SF Mono',monospace" fill="#7dd3fc" text-anchor="middle" letter-spacing="2">SKILLS</text>

  <!-- SOP (top-center) -->
  <circle cx="870" cy="96" r="30" fill="#0e1a2e" stroke="#a78bfa" stroke-width="1.6" filter="url(#subtleGlow)"/>
  <text x="870" y="90" font-size="14" text-anchor="middle" font-family="system-ui">🧩</text>
  <text x="870" y="106" font-size="8.5" font-family="'SF Mono',monospace" fill="#c4b5fd" text-anchor="middle" letter-spacing="2">PROLOG</text>

  <!-- ── Center Agent ── -->
  <circle cx="870" cy="240" r="52" fill="url(#centerHalo)" filter="url(#softGlow)"/>
  <circle cx="870" cy="240" r="44" fill="#111827" stroke="url(#nodePurple)" stroke-width="2.2"/>
  <circle cx="870" cy="240" r="38" fill="none" stroke="#a78bfa" stroke-width="0.6" stroke-dasharray="2 5" opacity="0.5"/>
  <text x="870" y="233" font-size="20" text-anchor="middle" font-family="system-ui" filter="url(#glow)">⚡</text>
  <text x="870" y="254" font-size="10" font-family="'SF Mono',monospace" fill="#e2e8f0"
        text-anchor="middle" letter-spacing="2.5" font-weight="700">AGENT</text>

  <!-- ═══════════════════════════ -->
  <!--  LEFT: Typography          -->
  <!-- ═══════════════════════════ -->

  <!-- Eyebrow label -->
  <rect x="52" y="68" width="148" height="22" rx="11" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" opacity="0.9"/>
  <text x="126" y="83" font-family="'SF Mono','Fira Code',monospace" font-size="10"
        fill="#a5b4fc" text-anchor="middle" letter-spacing="2">OPEN SOURCE</text>

  <!-- HARP wordmark -->
  <text x="50" y="188" font-family="'SF Pro Display','Inter','Helvetica Neue',sans-serif"
        font-size="116" font-weight="900" letter-spacing="-4"
        fill="url(#harpGrad)" filter="url(#glow)">HARP</text>

  <!-- Full name -->
  <text x="54" y="222" font-family="'SF Pro Display','Inter',sans-serif"
        font-size="17" font-weight="300" fill="#94a3b8" letter-spacing="1">
    HTML Agent Runtime Platform
  </text>

  <!-- Separator -->
  <rect x="54" y="240" width="280" height="1.5" rx="1" fill="url(#lineGrad)" opacity="0.7"/>

  <!-- Tagline -->
  <text x="54" y="268" font-family="'SF Mono','Fira Code',monospace" font-size="14" fill="#64748b">
    <tspan fill="#818cf8">HTML</tspan><tspan fill="#334155">  ≡  </tspan><tspan fill="#cbd5e1">Agent 的持久化家园</tspan>
  </text>

  <!-- Feature pills -->
  <g transform="translate(54,294)" font-family="'SF Pro Display','Inter',sans-serif" font-size="11">
    <!-- pill 1 -->
    <rect x="0"   y="0" width="110" height="24" rx="12" fill="#1e1b4b" stroke="#4f46e5" stroke-width="0.8"/>
    <text x="55"  y="16" fill="#a5b4fc" text-anchor="middle">持久身份</text>
    <!-- pill 2 -->
    <rect x="120" y="0" width="110" height="24" rx="12" fill="#0d2818" stroke="#065f46" stroke-width="0.8"/>
    <text x="175" y="16" fill="#6ee7b7" text-anchor="middle">四层记忆</text>
    <!-- pill 3 -->
    <rect x="240" y="0" width="110" height="24" rx="12" fill="#2d1b4e" stroke="#7c3aed" stroke-width="0.8"/>
    <text x="295" y="16" fill="#c4b5fd" text-anchor="middle">L1–L6 成长</text>
    <!-- pill 4 -->
    <rect x="0"   y="34" width="110" height="24" rx="12" fill="#1a0e2e" stroke="#9333ea" stroke-width="0.8"/>
    <text x="55"  y="50" fill="#e9d5ff" text-anchor="middle">反思引擎</text>
    <!-- pill 5 -->
    <rect x="120" y="34" width="110" height="24" rx="12" fill="#1c1500" stroke="#b45309" stroke-width="0.8"/>
    <text x="175" y="50" fill="#fcd34d" text-anchor="middle">SOP 流程</text>
    <!-- pill 6 -->
    <rect x="240" y="34" width="110" height="24" rx="12" fill="#0c1a2e" stroke="#0369a1" stroke-width="0.8"/>
    <text x="295" y="50" fill="#7dd3fc" text-anchor="middle">Prolog 推理</text>
  </g>

  <!-- Divider -->
  <line x1="54" y1="382" x2="590" y2="382" stroke="#1e293b" stroke-width="1"/>

  <!-- Stack row -->
  <g transform="translate(54,400)" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#475569">
    <text x="0"   y="0" fill="#fb923c">Rust</text>
    <text x="42"  y="0" fill="#374151">·</text>
    <text x="54"  y="0" fill="#60a5fa">Axum</text>
    <text x="102" y="0" fill="#374151">·</text>
    <text x="114" y="0" fill="#a78bfa">rig</text>
    <text x="138" y="0" fill="#374151">·</text>
    <text x="150" y="0" fill="#34d399">pgvector</text>
    <text x="224" y="0" fill="#374151">·</text>
    <text x="236" y="0" fill="#fbbf24">swiftide</text>
    <text x="306" y="0" fill="#374151">·</text>
    <text x="318" y="0" fill="#38bdf8">NATS</text>
    <text x="360" y="0" fill="#374151">·</text>
    <text x="372" y="0" fill="#f472b6">Next.js 15</text>
  </g>

  <!-- Stat cards -->
  <g transform="translate(54,424)">
    <!-- card 1 -->
    <rect x="0"   y="0" width="172" height="38" rx="8" fill="#0a1628" stroke="#1e3a5f" stroke-width="1"/>
    <text x="16"  y="15" font-family="'SF Mono',monospace" font-size="9" fill="#475569" letter-spacing="1.5">TOKEN SAVINGS</text>
    <text x="16"  y="31" font-family="'SF Pro Display',sans-serif" font-size="16" fill="#4ade80" font-weight="700" filter="url(#subtleGlow)">75 – 90 %</text>
    <!-- card 2 -->
    <rect x="188" y="0" width="172" height="38" rx="8" fill="#0a1628" stroke="#1e3a5f" stroke-width="1"/>
    <text x="204" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#475569" letter-spacing="1.5">AGENT STATES</text>
    <text x="204" y="31" font-family="'SF Pro Display',sans-serif" font-size="16" fill="#a78bfa" font-weight="700" filter="url(#subtleGlow)">7  ·  L1 → L6</text>
    <!-- card 3 -->
    <rect x="376" y="0" width="172" height="38" rx="8" fill="#0a1628" stroke="#1e3a5f" stroke-width="1"/>
    <text x="392" y="15" font-family="'SF Mono',monospace" font-size="9" fill="#475569" letter-spacing="1.5">API ENDPOINTS</text>
    <text x="392" y="31" font-family="'SF Pro Display',sans-serif" font-size="16" fill="#38bdf8" font-weight="700" filter="url(#subtleGlow)">36  REST</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="0" y="475" width="1200" height="5" fill="url(#bottomBar)"/>

  <!-- Vertical divider -->
  <line x1="638" y1="32" x2="638" y2="448" stroke="#1e293b" stroke-width="1.2" opacity="0.7"/>

  <!-- Decorative particles -->
  <g opacity="0.5" filter="url(#subtleGlow)">
    <circle cx="660" cy="60"  r="2.5" fill="#818cf8"/>
    <circle cx="685" cy="42"  r="1.5" fill="#e879f9"/>
    <circle cx="700" cy="68"  r="1"   fill="#38bdf8"/>
    <circle cx="655" cy="420" r="2"   fill="#34d399"/>
    <circle cx="680" cy="440" r="1.5" fill="#818cf8"/>
    <circle cx="700" cy="412" r="1"   fill="#fbbf24"/>
    <circle cx="1130" cy="80"  r="1.5" fill="#818cf8" opacity="0.3"/>
    <circle cx="1150" cy="400" r="1.5" fill="#34d399" opacity="0.3"/>
    <circle cx="680" cy="240" r="1.5" fill="#a78bfa" opacity="0.4"/>
  </g>

  </g>
</svg>
