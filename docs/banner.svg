<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#60a5fa"/>
      <stop offset="50%"  stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Node glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#60a5fa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <!-- Center glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Soft glow filter -->
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Text glow -->
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <g opacity="0.06" stroke="#60a5fa" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
  </g>

  <!-- ══════════════════════════════════════════ -->
  <!--  RIGHT SIDE: Agent Network Visualization   -->
  <!-- ══════════════════════════════════════════ -->

  <!-- Center glow background -->
  <circle cx="890" cy="300" r="180" fill="url(#centerGlow)"/>

  <!-- Connection lines -->
  <g opacity="0.35" stroke-width="1.5" fill="none">
    <!-- Center to Memory -->
    <line x1="890" y1="300" x2="740" y2="160" stroke="url(#titleGrad)" stroke-dasharray="4 3"/>
    <!-- Center to Growth -->
    <line x1="890" y1="300" x2="1055" y2="175" stroke="url(#titleGrad)" stroke-dasharray="4 3"/>
    <!-- Center to Reflection -->
    <line x1="890" y1="300" x2="1055" y2="420" stroke="url(#titleGrad)" stroke-dasharray="4 3"/>
    <!-- Center to Skills -->
    <line x1="890" y1="300" x2="740" y2="435" stroke="url(#titleGrad)" stroke-dasharray="4 3"/>
    <!-- Center to Prolog -->
    <line x1="890" y1="300" x2="890" y2="135" stroke="url(#titleGrad)" stroke-dasharray="4 3"/>
  </g>

  <!-- Orbit ring -->
  <circle cx="890" cy="300" r="155" fill="none" stroke="#60a5fa" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.3"/>

  <!-- ── Satellite nodes ── -->

  <!-- Memory node (top-left) -->
  <circle cx="740" cy="160" r="42" fill="url(#nodeGlow)"/>
  <circle cx="740" cy="160" r="34" fill="#1e293b" stroke="#60a5fa" stroke-width="1.5" opacity="0.9"/>
  <text x="740" y="153" font-family="monospace" font-size="18" fill="#60a5fa" text-anchor="middle" filter="url(#glow)">🧠</text>
  <text x="740" y="172" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">MEMORY</text>

  <!-- Growth node (top-right) -->
  <circle cx="1055" cy="175" r="42" fill="url(#nodeGlow)"/>
  <circle cx="1055" cy="175" r="34" fill="#1e293b" stroke="#34d399" stroke-width="1.5" opacity="0.9"/>
  <text x="1055" y="168" font-family="monospace" font-size="18" fill="#34d399" text-anchor="middle" filter="url(#glow)">📈</text>
  <text x="1055" y="187" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">GROWTH</text>

  <!-- Reflection node (bottom-right) -->
  <circle cx="1055" cy="420" r="42" fill="url(#nodeGlow)"/>
  <circle cx="1055" cy="420" r="34" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" opacity="0.9"/>
  <text x="1055" y="413" font-family="monospace" font-size="18" fill="#f472b6" text-anchor="middle" filter="url(#glow)">🔁</text>
  <text x="1055" y="432" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">REFLECT</text>

  <!-- Skills node (bottom-left) -->
  <circle cx="740" cy="435" r="42" fill="url(#nodeGlow)"/>
  <circle cx="740" cy="435" r="34" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" opacity="0.9"/>
  <text x="740" y="428" font-family="monospace" font-size="18" fill="#fbbf24" text-anchor="middle" filter="url(#glow)">🔧</text>
  <text x="740" y="447" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">SKILLS</text>

  <!-- Prolog node (top) -->
  <circle cx="890" cy="135" r="38" fill="url(#nodeGlow)"/>
  <circle cx="890" cy="135" r="30" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" opacity="0.9"/>
  <text x="890" y="129" font-family="monospace" font-size="16" fill="#a78bfa" text-anchor="middle" filter="url(#glow)">🧩</text>
  <text x="890" y="147" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">PROLOG</text>

  <!-- ── Center Agent node ── -->
  <circle cx="890" cy="300" r="58" fill="url(#centerGlow)" filter="url(#softGlow)"/>
  <circle cx="890" cy="300" r="48" fill="#1e293b" stroke="#a78bfa" stroke-width="2" opacity="0.95"/>
  <circle cx="890" cy="300" r="42" fill="none" stroke="#a78bfa" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.5"/>
  <text x="890" y="291" font-family="monospace" font-size="22" fill="#a78bfa" text-anchor="middle" filter="url(#glow)">⚡</text>
  <text x="890" y="312" font-family="'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" letter-spacing="2" font-weight="600">AGENT</text>

  <!-- ══════════════════════════════════ -->
  <!--  LEFT SIDE: Title & Description   -->
  <!-- ══════════════════════════════════ -->

  <!-- Top tag -->
  <rect x="52" y="72" width="130" height="26" rx="13" fill="#1e293b" stroke="#60a5fa" stroke-width="1" opacity="0.8"/>
  <text x="117" y="89" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#60a5fa" text-anchor="middle" letter-spacing="1.5">v 0.1.0  ·  Rust</text>

  <!-- Main title: HARP -->
  <text x="52" y="195" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="108" font-weight="900" fill="url(#titleGrad)"
        filter="url(#textGlow)" letter-spacing="-2">HARP</text>

  <!-- Subtitle line 1 -->
  <text x="54" y="242" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="19" fill="#cbd5e1" letter-spacing="0.5" font-weight="300">
    HTML Agent Runtime Platform
  </text>

  <!-- Divider -->
  <line x1="54" y1="263" x2="340" y2="263" stroke="url(#titleGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Core philosophy -->
  <text x="54" y="295" font-family="'SF Mono', 'Fira Code', monospace"
        font-size="15" fill="#94a3b8" letter-spacing="0.3">
    <tspan fill="#60a5fa">HTML</tspan>
    <tspan fill="#64748b">  =  </tspan>
    <tspan fill="#e2e8f0">Agent 的持久化家园</tspan>
  </text>

  <!-- Feature pills row 1 -->
  <g transform="translate(54, 330)">
    <!-- Pill 1: Persistent Identity -->
    <rect x="0" y="0" width="128" height="26" rx="13" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
    <text x="64" y="17" font-family="'SF Pro Display', sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">持久身份</text>

    <!-- Pill 2: Four-layer Memory -->
    <rect x="138" y="0" width="128" height="26" rx="13" fill="#2d1f5e" stroke="#7c3aed" stroke-width="1"/>
    <text x="202" y="17" font-family="'SF Pro Display', sans-serif" font-size="11" fill="#c4b5fd" text-anchor="middle">四层记忆</text>

    <!-- Pill 3: L1-L6 Growth -->
    <rect x="276" y="0" width="128" height="26" rx="13" fill="#1a3a2a" stroke="#059669" stroke-width="1"/>
    <text x="340" y="17" font-family="'SF Pro Display', sans-serif" font-size="11" fill="#6ee7b7" text-anchor="middle">L1-L6 成长</text>
  </g>

  <!-- Feature pills row 2 -->
  <g transform="translate(54, 366)">
    <!-- Pill 4: Reflection Engine -->
    <rect x="0" y="0" width="128" height="26" rx="13" fill="#3b1f3a" stroke="#db2777" stroke-width="1"/>
    <text x="64" y="17" font-family="'SF Pro Display', sans-serif" font-size="11" fill="#f9a8d4" text-anchor="middle">反思引擎</text>

    <!-- Pill 5: SOP -->
    <rect x="138" y="0" width="128" height="26" rx="13" fill="#3a2a10" stroke="#d97706" stroke-width="1"/>
    <text x="202" y="17" font-family="'SF Pro Display', sans-serif" font-size="11" fill="#fcd34d" text-anchor="middle">SOP 流程</text>

    <!-- Pill 6: Prolog Rules -->
    <rect x="276" y="0" width="128" height="26" rx="13" fill="#1a2a3a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="340" y="17" font-family="'SF Pro Display', sans-serif" font-size="11" fill="#7dd3fc" text-anchor="middle">Prolog 推理</text>
  </g>

  <!-- Tech stack bar -->
  <rect x="54" y="422" width="560" height="1" fill="#1e293b"/>

  <!-- Stack icons row -->
  <g transform="translate(54, 438)" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#475569">
    <text x="0"   y="14" fill="#f97316">Rust</text>
    <text x="44"  y="14">·</text>
    <text x="58"  y="14" fill="#3b82f6">Axum</text>
    <text x="108" y="14">·</text>
    <text x="122" y="14" fill="#a78bfa">rig</text>
    <text x="148" y="14">·</text>
    <text x="162" y="14" fill="#34d399">pgvector</text>
    <text x="232" y="14">·</text>
    <text x="246" y="14" fill="#fbbf24">swiftide</text>
    <text x="316" y="14">·</text>
    <text x="330" y="14" fill="#60a5fa">NATS</text>
    <text x="375" y="14">·</text>
    <text x="389" y="14" fill="#f472b6">Next.js</text>
  </g>

  <!-- Token savings badge -->
  <rect x="54" y="490" width="240" height="56" rx="10" fill="#0f2318" stroke="#16a34a" stroke-width="1.2"/>
  <text x="74" y="516" font-family="'SF Pro Display', sans-serif" font-size="12" fill="#86efac" font-weight="600">💰  Token 成本节省</text>
  <text x="74" y="536" font-family="'SF Mono', monospace" font-size="22" fill="#4ade80" font-weight="700" filter="url(#glow)">75 – 90 %</text>

  <!-- State machine badge -->
  <rect x="310" y="490" width="240" height="56" rx="10" fill="#1a0f2e" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="330" y="516" font-family="'SF Pro Display', sans-serif" font-size="12" fill="#c4b5fd" font-weight="600">⚡  Agent 状态机</text>
  <text x="330" y="536" font-family="'SF Mono', monospace" font-size="14" fill="#a78bfa" font-weight="600">7 States · L1 → L6</text>

  <!-- ══════════════════════════════ -->
  <!--  DECORATIVE: floating dots    -->
  <!-- ══════════════════════════════ -->
  <g opacity="0.4">
    <circle cx="620" cy="80"  r="2" fill="#60a5fa"/>
    <circle cx="650" cy="55"  r="1.5" fill="#a78bfa"/>
    <circle cx="680" cy="90"  r="1" fill="#f472b6"/>
    <circle cx="610" cy="520" r="2" fill="#34d399"/>
    <circle cx="645" cy="540" r="1.5" fill="#fbbf24"/>
    <circle cx="670" cy="510" r="1" fill="#60a5fa"/>
  </g>

  <!-- Vertical separator line -->
  <line x1="640" y1="40" x2="640" y2="560" stroke="#1e293b" stroke-width="1.5" opacity="0.6"/>

  <!-- Bottom border accent -->
  <rect x="0" y="594" width="1200" height="6" fill="url(#titleGrad)" opacity="0.8"/>
</svg>
